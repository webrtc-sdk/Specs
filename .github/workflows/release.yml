name: release

# Runs when a release/<version> PR is merged: downloads WebRTC.xcframework.zip
# from the webrtc-build release m<version>, checks it against the checksum in
# Package.swift, publishes it as this repository's release <version>, then
# pushes the podspec to CocoaPods trunk (needs COCOAPODS_TRUNK_TOKEN).

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to (re)publish from the default branch'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false
  # Queue every waiting release: by default a newer run cancels the pending
  # one, which would leave that merged release unpublished.
  queue: max

env:
  SOURCE_REPO: ${{ vars.SOURCE_REPO || 'webrtc-sdk/webrtc-build' }}

jobs:
  github-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
    - name: Version
      id: v
      env:
        INPUT: ${{ inputs.version || github.event.pull_request.head.ref }}
      run: |
        set -euo pipefail
        VERSION="${INPUT#release/}"
        POD=$(sed -nE 's/.*spec\.version *= *"([^"]+)".*/\1/p' WebRTC-SDK.podspec)
        [ "$POD" = "$VERSION" ] || { echo "::error::podspec version $POD != $VERSION"; exit 1; }
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Download and verify binary
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.v.outputs.version }}
      run: |
        set -euo pipefail
        mkdir -p dist
        gh release download "m$VERSION" -R "$SOURCE_REPO" -p WebRTC.xcframework.zip -D dist
        EXPECTED=$(sed -nE 's/.*checksum: *"([0-9a-f]+)".*/\1/p' Package.swift)
        ACTUAL=$(shasum -a 256 dist/WebRTC.xcframework.zip | awk '{print $1}')
        [ "$EXPECTED" = "$ACTUAL" ] || { echo "::error::checksum mismatch: Package.swift $EXPECTED, binary $ACTUAL"; exit 1; }
        (cd dist && shasum -a 256 WebRTC.xcframework.zip > WebRTC.xcframework.zip.shasum)
    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.v.outputs.version }}
      run: |
        set -euo pipefail
        {
          echo "WebRTC-SDK $VERSION, built by [$SOURCE_REPO m$VERSION](https://github.com/$SOURCE_REPO/releases/tag/m$VERSION)."
          echo
          gh release view "m$VERSION" -R "$SOURCE_REPO" --json body --jq .body
        } > "$RUNNER_TEMP/notes.md"
        if gh release view "$VERSION" >/dev/null 2>&1; then
          gh release upload "$VERSION" dist/* --clobber
        else
          gh release create "$VERSION" dist/* --target "${{ steps.v.outputs.ref }}" --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
        fi

  cocoapods:
    needs: github-release
    runs-on: macos-latest
    steps:
    - name: Check secret
      id: check
      env:
        TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
      run: |
        if [ -z "$TOKEN" ]; then echo "::notice::COCOAPODS_TRUNK_TOKEN not set; skipping"; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
    - uses: actions/checkout@v5
      if: steps.check.outputs.skip != 'true'
      with:
        ref: ${{ needs.github-release.outputs.ref }}
    - name: Push to CocoaPods trunk
      if: steps.check.outputs.skip != 'true'
      env:
        COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
      run: |
        set -eo pipefail
        gem install cocoapods
        pod spec lint --allow-warnings --skip-import-validation --platforms=iOS,macOS
        pod trunk push --allow-warnings --skip-import-validation
